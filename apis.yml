name: X Zell
description: >-
  X-ZELL is a Thailand-based medical technology company (Y Combinator W15) building a
  multiplex cytopathology product ecosystem that combines cryofixation, immunostaining,
  and digital imaging to turn limited cytology specimens into data-rich diagnostic
  workflows. Its Cryosuite platform pairs a Cryofixator and Cryostainer for specimen
  processing and automated staining, alongside Cryophore multiplex antibody panels for
  pleural fluid, ascitic fluid, and tumor-origin analysis, validated conjugated
  antibodies, and ISO 13485-certified reagent and OEM manufacturing. Founded by
  physician-scientist Sebastian Punyaratabandhu Bhakdi, the company originated in
  rare-cell detection (Circulating Endothelial Cells). It is a hardware, reagent, and
  laboratory-instrument business and publishes no public API, developer platform, SDKs,
  or machine-readable API specifications at this time.
